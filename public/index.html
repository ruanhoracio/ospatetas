<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Ospatetas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1f1633;
    --paper: #fffaf2;
    --accent: #ff6fa8;
    --accent2: #ffd23f;
    --wine: #7a2848;
    --muted: #6b6280;
    --line: #e9dfd0;
    --panel: rgba(255, 250, 242, 0.96);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --ink: #fdf4ff; --paper: #1d1729; --muted: #b7accb; --line: #3a3150; --panel: rgba(29, 23, 41, 0.95); }
  }
  :root[data-theme="dark"] { --ink: #fdf4ff; --paper: #1d1729; --muted: #b7accb; --line: #3a3150; --panel: rgba(29, 23, 41, 0.95); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #3b1530; font-family: 'Nunito', system-ui, sans-serif; color: var(--ink); }
  canvas#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .hidden { display: none !important; }
  button { font: inherit; cursor: pointer; }


  /* ---------- abertura ---------- */
  #splash { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; padding: 16px;
    background: radial-gradient(circle at 50% 40%, #ff8fc0 0%, #c2407a 45%, #4a1238 100%); overflow: hidden; transition: opacity .6s, transform .6s; cursor: pointer; }
  #splash.bye { opacity: 0; transform: scale(1.08); pointer-events: none; }
  #splash .bub { position: absolute; bottom: -80px; border-radius: 50%; background: radial-gradient(circle at 30% 30%, rgba(255,255,255,.85), rgba(255,182,214,.35) 40%, rgba(255,111,168,.12) 70%); animation: rise linear infinite; }
  @keyframes rise { to { transform: translateY(-120vh) translateX(var(--dx)); } }
  #splash .sl { width: min(680px, 88vw); animation: drop 1.1s cubic-bezier(.25,1.7,.45,1) both, wob2 2.4s 1.1s ease-in-out infinite; filter: drop-shadow(0 14px 0 rgba(74,18,56,.45)); transform-origin: 50% 90%; }
  @keyframes drop { 0% { transform: translateY(-70vh) scale(.6, 1.4); } 60% { transform: translateY(0) scale(1.25, .7); } 80% { transform: scale(.92, 1.1); } 100% { transform: none; } }
  @keyframes wob2 { 0%,100% { transform: scale(1) rotate(0); } 25% { transform: scale(1.04,.96) rotate(-1.5deg); } 75% { transform: scale(.97,1.03) rotate(1.5deg); } }
  #splash .load { width: min(420px, 80vw); position: relative; padding-top: 34px; }
  #splash .bar { height: 26px; border-radius: 999px; background: rgba(74,18,56,.55); border: 4px solid #4a1238; overflow: hidden; box-shadow: 0 6px 0 #4a1238; }
  #splash .fill { height: 100%; width: 0%; border-radius: 999px; background: repeating-linear-gradient(-45deg, #ffd23f 0 14px, #ffb703 14px 28px); background-size: 40px 40px; animation: stripes .6s linear infinite; }
  @keyframes stripes { to { background-position: 40px 0; } }
  #splash .runner { position: absolute; top: 0; left: 0; width: 34px; height: 40px; transform: translateX(-50%); }
  #splash .runner i { position: absolute; left: 4px; top: 0; width: 26px; height: 32px; border-radius: 14px 14px 12px 12px; background: #ff6fa8; border: 3px solid #4a1238; animation: hop .28s ease-in-out infinite alternate; }
  #splash .runner i::before, #splash .runner i::after { content: ''; position: absolute; top: 8px; width: 6px; height: 7px; border-radius: 50%; background: #1f1633; }
  #splash .runner i::before { left: 6px; } #splash .runner i::after { left: 13px; }
  @keyframes hop { from { transform: translateY(0) rotate(-12deg) scale(1.05,.95); } to { transform: translateY(-9px) rotate(12deg) scale(.95,1.06); } }
  #splash .tip { text-align: center; color: #fff; font-weight: 800; font-size: 16px; margin-top: 16px; min-height: 22px; text-shadow: 0 2px 0 rgba(74,18,56,.6); }
  #splash .pct { font-family: 'Lilita One', sans-serif; color: #ffd23f; font-size: 22px; text-align: center; margin-top: 4px; -webkit-text-stroke: 1.5px #4a1238; }

  /* ---------- lobby ---------- */
  #lobby { position: fixed; inset: 0; display: flex; align-items: center; padding: 16px; pointer-events: none; }
  #lobby .card { pointer-events: auto; width: min(430px, 100%); max-height: calc(100% - 8px); overflow-y: auto; background: var(--panel); border-radius: 22px; padding: 22px 22px 18px; box-shadow: 0 18px 0 rgba(0,0,0,.18), 0 30px 60px rgba(0,0,0,.25); border: 3px solid var(--wine); margin-left: max(0px, 5vw); animation: pop .6s cubic-bezier(.3,1.6,.5,1) both; }
  @keyframes pop { from { transform: scale(.7) rotate(-3deg); opacity: 0; } to { transform: none; opacity: 1; } }
  .logo { display: block; width: 100%; max-width: 360px; margin: -6px auto 2px; filter: drop-shadow(0 6px 0 rgba(122,40,72,.35)); animation: wob 3.2s ease-in-out infinite; transform-origin: 50% 80%; }
  @keyframes wob { 0%,100% { transform: rotate(-2deg) scale(1); } 50% { transform: rotate(1.5deg) scale(1.03, .98); } }
  h1 { font-family: 'Lilita One', sans-serif; font-weight: 400; font-size: 44px; line-height: .95; margin: 0 0 4px; letter-spacing: .5px; color: var(--accent); text-shadow: 3px 3px 0 var(--ink); transform: rotate(-2deg); }
  h1 span { color: var(--accent2); display: block; }
  .sub { color: var(--muted); margin: 4px 0 12px; font-size: 14px; text-align: center; }
  label.f { display: block; font-weight: 800; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; margin: 14px 0 6px; color: var(--muted); }
  input[type=text] { width: 100%; font: inherit; font-size: 18px; font-weight: 800; padding: 10px 12px; border-radius: 12px; border: 3px solid var(--ink); background: var(--paper); color: var(--ink); outline: none; }
  input[type=text]:focus { border-color: var(--accent); }
  .swatches { display: flex; flex-wrap: wrap; gap: 7px; }
  .sw { width: 32px; height: 32px; border-radius: 50%; border: 3px solid var(--ink); box-shadow: inset 0 -5px 0 rgba(0,0,0,.18); }
  .sw.on { outline: 3px solid var(--accent); outline-offset: 2px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { border: 2px solid var(--ink); background: var(--paper); color: var(--ink); border-radius: 999px; padding: 5px 11px; font-weight: 800; font-size: 13px; }
  .chip.on { background: var(--ink); color: var(--paper); }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  .big { display: block; width: 100%; font-family: 'Lilita One', sans-serif; font-size: 22px; padding: 12px; border-radius: 14px; border: 3px solid var(--wine); background: var(--accent); color: #fff; box-shadow: 0 5px 0 var(--wine); margin-top: 10px; text-shadow: 1px 2px 0 rgba(0,0,0,.25); }
  .big:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--wine); }
  .big:hover:not(:disabled) { filter: brightness(1.06); }
  .big.alt { background: var(--accent2); color: var(--ink); text-shadow: none; }
  .big:disabled { opacity: .45; cursor: not-allowed; }
  .sect { font-family: 'Lilita One', sans-serif; font-size: 20px; color: var(--accent); margin: 18px 0 -4px; padding-top: 14px; border-top: 2px dashed var(--line); }
  .note { font-size: 12px; color: var(--muted); margin-top: 8px; }

  /* ---------- HUD ---------- */
  #hud { position: fixed; inset: 0; pointer-events: none; color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,.45); }
  #banner { position: absolute; top: 16%; left: 0; right: 0; text-align: center; font-family: 'Lilita One', sans-serif; font-size: clamp(36px, 8vw, 84px); color: var(--accent2); -webkit-text-stroke: 3px #1f1633; text-shadow: 0 6px 0 #1f1633; transition: opacity .3s, transform .3s; padding: 0 16px; }
  #banner.small { font-size: clamp(18px, 3.4vw, 26px); -webkit-text-stroke: 0; color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,.6); top: 9%; }
  #mapname { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); font-family: 'Lilita One', sans-serif; font-size: 20px; background: rgba(31,22,51,.55); padding: 4px 16px; border-radius: 999px; white-space: nowrap; }
  #plist { position: absolute; top: 12px; left: 12px; display: flex; flex-direction: column; gap: 5px; max-width: 46vw; }
  .pl { display: flex; align-items: center; gap: 7px; background: rgba(31,22,51,.55); padding: 4px 10px 4px 5px; border-radius: 999px; font-weight: 800; font-size: 14px; }
  .pl .dot { width: 18px; height: 18px; border-radius: 50%; border: 2px solid #fff; flex: none; }
  .pl.out { opacity: .45; }
  .pl .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pl .bar { width: 38px; height: 6px; border-radius: 3px; background: rgba(255,255,255,.25); overflow: hidden; flex: none; }
  .pl .bar i { display: block; height: 100%; background: #4ade80; }
  #feed { position: absolute; left: 12px; bottom: 12px; display: flex; flex-direction: column; gap: 4px; font-weight: 800; font-size: 14px; max-width: 60vw; }
  #feed div { background: rgba(31,22,51,.5); padding: 3px 10px; border-radius: 8px; animation: fade 6s forwards; }
  @keyframes fade { 0%, 80% { opacity: 1; } 100% { opacity: 0; } }
  #tools { position: absolute; top: 12px; right: 12px; display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; max-width: 48vw; pointer-events: auto; }
  .tb { background: rgba(31,22,51,.7); color: #fff; border: 2px solid rgba(255,255,255,.7); border-radius: 10px; padding: 6px 10px; font-weight: 800; font-size: 13px; }
  .tb:hover { background: rgba(31,22,51,.9); }
  select.tb { appearance: none; }
  #help { position: absolute; right: 12px; bottom: 12px; background: rgba(31,22,51,.6); border-radius: 12px; padding: 8px 12px; font-size: 13px; font-weight: 600; line-height: 1.55; }
  #help b { color: var(--accent2); }
  kbd { background: rgba(255,255,255,.18); border-radius: 5px; padding: 0 5px; font-family: inherit; font-weight: 800; }
  #chatbox { position: absolute; left: 12px; bottom: 50%; pointer-events: auto; }
  #chatbox input { width: min(320px, 70vw); font-size: 15px; padding: 7px 10px; border: 2px solid #fff; background: rgba(31,22,51,.85); color: #fff; }

  /* ---------- toque ---------- */
  #touch { position: fixed; inset: 0; pointer-events: none; }
  #stick { position: absolute; left: 22px; bottom: 26px; width: 130px; height: 130px; border-radius: 50%; background: rgba(255,255,255,.15); border: 3px solid rgba(255,255,255,.5); pointer-events: auto; touch-action: none; }
  #knob { position: absolute; left: 40px; top: 40px; width: 50px; height: 50px; border-radius: 50%; background: rgba(255,255,255,.75); }
  #tbtns { position: absolute; right: 18px; bottom: 22px; display: grid; grid-template-columns: 76px 76px; gap: 10px; pointer-events: auto; }
  #tbtns button { width: 76px; height: 76px; border-radius: 50%; border: 3px solid #fff; background: rgba(31,22,51,.55); color: #fff; font-family: 'Lilita One', sans-serif; font-size: 15px; touch-action: none; }
  #tbtns button.on { background: var(--accent); }
  @media (max-width: 900px) { #mapname { display: none; } #tools { max-width: 60vw; } }
  body.touch #feed { bottom: 190px; }
  @media (max-width: 640px) {
    #help { display: none; }
    #lobby { align-items: flex-end; }
    #lobby .card { margin-left: 0; max-height: 72%; }
    .logo { max-width: 240px; }
    .sub { display: none; }
    #lobby .card { padding: 16px; }
  }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js", "cannon-es": "./vendor/cannon-es.js" } }
</script>
</head>
<body>
<canvas id="c"></canvas>

<div id="splash">
  <img class="sl" src="./logo.png" alt="Ospatetas">
  <div class="load">
    <div class="runner" id="runner"><i></i></div>
    <div class="bar"><div class="fill" id="fill"></div></div>
    <div class="pct" id="pct">0%</div>
    <div class="tip" id="tip">Enchendo os bonecos de gelatina…</div>
  </div>
</div>

<div id="lobby" class="hidden">
  <div class="card">
    <img class="logo" src="./logo.png" alt="Ospatetas">
    <p class="sub">Agarre, soque e jogue seus amigos pra fora do mapa.<br>O último em pé vence.</p>

    <label class="f" for="name">Seu nome</label>
    <input type="text" id="name" maxlength="16" placeholder="Digite seu nome" autocomplete="off">

    <label class="f" for="room">Sala (mande o código pros amigos)</label>
    <div class="row">
      <input type="text" id="room" maxlength="8" autocomplete="off" style="text-transform:uppercase">
    </div>
    <button class="big" id="playOnline">Jogar online</button>
    <button class="big alt" id="playLocal">Treinar contra bots</button>
    <div class="note" id="netnote"></div>

    <div class="sect">Personalize seu pateta</div>
    <label class="f">Cor</label>
    <div class="swatches" id="colors"></div>
    <label class="f">Chapéu</label>
    <div class="chips" id="hats"></div>
    <label class="f">Olhos</label>
    <div class="chips" id="eyes"></div>
    <label class="f">Acessório</label>
    <div class="chips" id="accs"></div>

  </div>
</div>

<div id="hud" class="hidden">
  <div id="mapname"></div>
  <div id="banner"></div>
  <div id="plist"></div>
  <div id="feed"></div>
  <div id="tools">
    <button class="tb" id="botAdd">+ Bot</button>
    <button class="tb" id="botDel">− Bot</button>
    <select class="tb" id="mapSel"></select>
    <button class="tb" id="invite">Convidar</button>
    <button class="tb" id="leave">Sair</button>
  </div>
  <div id="help">
    <b>Andar</b> <kbd>WASD</kbd> · <b>Pular</b> <kbd>Espaço</kbd><br>
    <b>Soco</b> <kbd>J</kbd> ou clique esquerdo<br>
    <b>Agarrar</b> segure <kbd>K</kbd> ou clique direito<br>
    <b>Levantar</b> segure <kbd>L</kbd> / <kbd>Shift</kbd> e solte o agarrar pra arremessar<br>
    <b>Chat</b> <kbd>Enter</kbd>
  </div>
  <div id="chatbox" class="hidden"><input type="text" id="chatin" maxlength="120" placeholder="Mensagem…"></div>
</div>

<div id="touch" class="hidden">
  <div id="stick"><div id="knob"></div></div>
  <div id="tbtns">
    <button data-k="grab">Agarrar</button>
    <button data-k="lift">Levantar</button>
    <button data-k="punch">Soco</button>
    <button data-k="jump">Pular</button>
  </div>
</div>

<script type="module" src="./main.js"></script>
</body>
</html>
